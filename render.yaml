services:
  - type: web
    name: erpnext-qsr-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: bench serve --port 8000
    envVars:
      - key: DB_HOST
        value: YOUR_AIVEN_MARIADB_HOST
      - key: DB_PORT
        value: "3306"
      - key: REDIS_CACHE
        value: YOUR_UPSTASH_REDIS_URL

  - type: worker
    name: erpnext-qsr-worker
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: bench worker --queue default,short,long
